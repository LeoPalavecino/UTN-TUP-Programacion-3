<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <header>
        <h1>Formulario de Registro</h1>
        <p>Por favor completar los siguientes datos.</p>
    </header>

    <main>
        <form action="#" method="POST" 
        onsubmit="alert('¡Formulario enviado con éxito!'); return false;">

            <!-- 1. Nombre completo -->
            <label for="nombre">Nombre completo:</label><br>
            <input 
                type="text" 
                id="nombre" 
                name="nombre" 
                placeholder="Ej: Juan Pérez" 
                required 
                tabindex="1">
            <br><br>

            <!-- 2. Correo electrónico -->
            <label for="email">Correo electrónico:</label><br>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Ej: correo@ejemplo.com" 
                required 
                tabindex="2">
            <br><br>

            <!-- 3. Contraseña -->
            <label for="password">Contraseña:</label><br>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Mínimo 8 caracteres" 
                minlength="8" 
                required 
                tabindex="3">
            <br><br>

            <!-- 4. Selección de género (radio) -->
            <fieldset>
                <legend>Género:</legend>
                
                <input type="radio" id="genero-masculino" name="genero" value="masculino" required tabindex="4">
                <label for="genero-masculino">Masculino</label><br>

                <input type="radio" id="genero-femenino" name="genero" value="femenino" tabindex="5">
                <label for="genero-femenino">Femenino</label><br>

                <input type="radio" id="genero-otro" name="genero" value="otro" tabindex="6">
                <label for="genero-otro">Otro</label>
            </fieldset>
            <br>

            <!-- 5. Intereses (checkbox) -->
            <fieldset>
                <legend>Intereses:</legend>

                <input type="checkbox" id="interes-musica" name="intereses" value="musica" tabindex="7">
                <label for="interes-musica">Música</label><br>

                <input type="checkbox" id="interes-deporte" name="intereses" value="deporte" tabindex="8">
                <label for="interes-deporte">Deporte</label><br>

                <input type="checkbox" id="interes-lectura" name="intereses" value="lectura" tabindex="9">
                <label for="interes-lectura">Lectura</label><br>

                <input type="checkbox" id="interes-tecnologia" name="intereses" value="tecnologia" tabindex="10">
                <label for="interes-tecnologia">Tecnología</label>
            </fieldset>
            <br>

            <!-- 6. País (select) -->
            <label for="pais">País:</label><br>
            <select id="pais" name="pais" required tabindex="11">
                <option value="" disabled selected>Seleccione un país...</option>
                <option value="rgentina">Argentina</option>
                <option value="brasil">Brasil</option>
                <option value="chile">Chile</option>
            </select>
            <br><br>

            <!-- 7. Comentarios adicionales (textarea) -->
            <label for="comentarios">Comentarios adicionales:</label><br>
            <textarea 
                id="comentarios" 
                name="comentarios" 
                rows="4" 
                cols="40" 
                placeholder="Escriba aquí sus comentarios..." 
                tabindex="12"></textarea>
            <br><br>

            <!-- 8. Botón de envío -->
            <input type="submit" value="Registrarse" tabindex="13">
            
            

        </form>
    </main>

</body>
</html>
