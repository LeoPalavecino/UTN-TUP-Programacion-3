<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Práctico: Tarjetas de Producto</title>
    <link rel="stylesheet" href="productos.css">
</head>
<body>

    <header class="header-principal">
        <h1 style="text-align: center;">Trabajo Práctico: Tarjetas de Producto</h1>
    </header>

    <main class="contenedor-galeria">
        <h2 style="text-align: center;">Galería de Productos</h2>

        <!-- Contenedor para alinear las tarjetas inline-block -->
        <div class="fila-productos">
            
            <!-- Tarjeta 1: Auriculares Pro -->
            <article class="tarjeta-producto">
                <div class="imagen-simulada"></div>
                <h3 class="titulo-producto">Auriculares Pro</h3>
                <p class="descripcion-producto">
                    Auriculares inalámbricos con cancelación de ruido.
                </p>
                <button type="button" class="btn-comprar">Comprar</button>
            </article>

            <!-- Tarjeta 2: Teclado Mecánico -->
            <article class="tarjeta-producto">
                <div class="imagen-simulada"></div>
                <h3 class="titulo-producto">Teclado Mecánico</h3>
                <p class="descripcion-producto">
                    Teclado con retroiluminación RGB, switches azules.
                </p>
                <button type="button" class="btn-comprar">Comprar</button>
            </article>

        </div>
    </main>

    <footer class="footer-principal">
        <p>Resolución del Trabajo Práctico 2 - Programación 3</p>
    </footer>

</body>
</html>
