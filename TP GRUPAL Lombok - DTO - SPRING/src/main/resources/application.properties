spring.application.name=tp-spring-reportes
server.port=8080
# Persistencia demo local: se conserva entre reinicios en ./facturas.mv.db.
spring.datasource.url=jdbc:h2:file:./facturas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
app.demo-data.enabled=true
